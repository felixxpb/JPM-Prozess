name: Daten aktualisieren

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daten-holen:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      LAENDER_DATEN: ${{ github.workspace }}/laender/daten
    steps:
      - name: Repository holen
        uses: actions/checkout@v4

      - name: Laenderanalyse USA
        continue-on-error: true
        run: python3 -X utf8 skripte/Laender_Abrufen_USA.py

      - name: Aktualisierte Daten zurueckschreiben
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add laender/daten
          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Daten automatisch aktualisiert ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push
          fi

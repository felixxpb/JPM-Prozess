name: RBA Erreichbarkeit testen
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: RBA-Probe 2
        run: |
          B=https://www.rba.gov.au
          g(){ curl -s -m 60 -A "Mozilla/5.0" -L -o "$1" "$2"; }
          g cal.html $B/schedules-events/calendar/
          g m26.html $B/monetary-policy/rba-board-minutes/2026/
          g smp.html $B/publications/smp/2026/nov/
          g mpb.html $B/about-rba/boards/monetary-policy-board/
          g dec.html $B/monetary-policy/int-rate-decisions/2026/
          python3 - <<'PY'
          import re,html,os
          def raw(f): return open(f,encoding="utf-8",errors="replace").read()
          def clean(f):
              s=re.sub(r"(?s)<(script|style|nav|header|footer).*?</\1>","",raw(f))
              return html.unescape(re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",s)))
          def links(f,pat): return sorted(set(re.findall(r'href="([^"]*%s[^"]*)"'%pat,raw(f))))
          print("@@@ KALENDER",len(raw("cal.html")))
          t=clean("cal.html"); i=t.find("2027"); print(t[max(0,i-1500):i+1500] if i>0 else t[:2500])
          print("@@@ MINUTES 2026",len(raw("m26.html"))); print(links("m26.html","minutes/2026")[:20])
          print(clean("m26.html")[-1800:])
          ls=[l for l in links("m26.html","minutes/2026/") if re.search(r"/20\d\d-\d\d-\d\d",l)]
          print("@@@ LINKS",ls[:5])
          if ls:
              u=ls[0] if ls[0].startswith("http") else "https://www.rba.gov.au"+ls[0]
              os.system('curl -s -m 60 -A "Mozilla/5.0" -L -o min1.html "%s"'%u)
              t=clean("min1.html"); print("@@@ MINUTE",u,len(t))
              for m in re.finditer(r"(?i)(voted|vote|unanimous|dissent|members? (agreed|decided)|in favour)",t):
                  print("   ...",t[max(0,m.start()-250):m.start()+350]); break
              print(t[1500:4500])
          print("@@@ SMP NOV",len(raw("smp.html"))); print(clean("smp.html")[-2200:])
          print("@@@ MPB",len(raw("mpb.html"))); t=clean("mpb.html"); i=t.find("Members"); print(t[i:i+2500] if i>0 else t[-2500:])
          print("@@@ DECISIONS",len(raw("dec.html"))); print(clean("dec.html")[-1500:])
          PY
